apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: merchantcopilot-v2
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
          env:
            - name: DEMO_MONTHLY_RUN_CAP
              value: "1000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: merchantcopilot-database-url
                  key: latest
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: merchantcopilot-database-direct-url
                  key: latest
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: merchantcopilot-deepseek-key
                  key: latest
            - name: DEMO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: merchantcopilot-demo-token
                  key: latest
