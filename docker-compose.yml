services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: merchantcopilot
      POSTGRES_USER: merchantcopilot
      POSTGRES_PASSWORD: merchantcopilot
    ports:
      # 5432 is occupied by a user-managed local Postgres/SSH tunnel on this Mac.
      - "55432:5432"
    volumes:
      - merchantcopilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchantcopilot -d merchantcopilot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  merchantcopilot_pgdata:
